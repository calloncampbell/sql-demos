name: Build StarTrek.Database

on:
  push:
    branches: [main]
    paths: ['src/Databases/StarTrek.Database/**', '.github/workflows/build-database.yml']
  pull_request:
    paths: ['src/Databases/StarTrek.Database/**', '.github/workflows/build-database.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/Databases/StarTrek.Database/global.json

      - name: Build dacpac
        run: dotnet build src/Databases/StarTrek.Database/StarTrek.Database.sqlproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: StarTrek.Database.dacpac
          path: src/Databases/StarTrek.Database/bin/Release/StarTrek.Database.dacpac
